name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'const p = await Bun.file("package.json").json(); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag must match package.json version");'
      - run: bun run lint
      - run: bun test --randomize
      - run: bun run release:package
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: release-packages
          path: |
            ardi-ardia-*.zip
            ardi-chrome-*.zip
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > generated-notes.md
          awk '/^## New Contributors/ { skip=1; next } /^## |^\*\*Full Changelog/ { skip=0 } !skip' generated-notes.md > release-notes.md
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Ardi $RELEASE_TAG" --notes-file release-notes.md
